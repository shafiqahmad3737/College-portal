<section class="page-section active" id="notices">
<div class="section-header"><div><h2>Notices</h2><p>College announcements and updates.</p></div><button class="primary-btn admin-only" id="addNoticeBtn">+ Add Notice</button></div>
<div id="noticeList" class="notice-list"></div>
<div class="modal-overlay" id="noticeModal"><div class="modal"><div class="modal-header"><h2>Add Notice</h2><button type="button" data-close-modal="noticeModal">×</button></div><form id="noticeForm"><div class="form-group"><label>Title</label><input id="noticeTitle" required></div><div class="form-group"><label>Description</label><textarea id="noticeDescription" rows="4" required></textarea></div><div class="modal-actions"><button type="button" class="secondary-btn" data-close-modal="noticeModal">Cancel</button><button class="primary-btn">Save Notice</button></div></form></div></div>
</section>
