<section class="page-section active" id="students">
<div class="section-header">
    <div><h2>Students</h2><p>Manage registered students and their information.</p></div>
    <button class="primary-btn admin-only" id="addStudentBtn">+ Add Student</button>
</div>

<div class="card">
    <div class="card-header">
        <div><h3>Student Records</h3><p>Search, edit and manage student records.</p></div>
        <div class="table-actions">
            <input id="studentSearch" class="search-input" placeholder="Search students...">
            <select id="departmentFilter" class="filter-select">
                <option value="all">All Departments</option>
                <option>Computer Science</option>
                <option>Software Engineering</option>
                <option>Information Technology</option>
                <option>Business</option>
            </select>
        </div>
    </div>
    <div class="table-wrapper">
        <table>
            <thead><tr><th>Student</th><th>ID</th><th>Department</th><th>Semester</th><th>CGPA</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="studentsTableBody"></tbody>
        </table>
    </div>
</div>

<div class="modal-overlay" id="studentModal">
<div class="modal">
    <div class="modal-header"><h2 id="studentModalTitle">Add Student</h2><button type="button" data-close-modal="studentModal">×</button></div>
    <form id="studentForm">
        <input type="hidden" id="editStudentIndex">
        <div class="form-grid">
            <div class="form-group"><label>Name</label><input id="studentName" required></div>
            <div class="form-group"><label>Student ID</label><input id="studentId" required></div>
            <div class="form-group"><label>Department</label><select id="studentDepartment" required><option>Computer Science</option><option>Software Engineering</option><option>Information Technology</option><option>Business</option></select></div>
            <div class="form-group"><label>Semester</label><select id="studentSemester"><option>1st</option><option>2nd</option><option>3rd</option><option>4th</option><option>5th</option><option>6th</option><option>7th</option><option>8th</option></select></div>
            <div class="form-group"><label>CGPA</label><input id="studentCgpa" type="number" min="0" max="4" step=".01" required></div>
            <div class="form-group"><label>Status</label><select id="studentStatus"><option>Active</option><option>Inactive</option></select></div>
        </div>
        <div class="modal-actions"><button type="button" class="secondary-btn" data-close-modal="studentModal">Cancel</button><button class="primary-btn" type="submit">Save Student</button></div>
    </form>
</div>
</div>
</section>
